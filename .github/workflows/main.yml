name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: flap.exe
            installer_name: flap_installer.exe
            pkg_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: flap
            installer_name: flap_installer
            pkg_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: flap
            installer_name: flap_installer
            pkg_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Assets
        shell: bash
        run: |
          mkdir -p assets
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} assets/
          cp target/${{ matrix.target }}/release/${{ matrix.installer_name }} assets/

          cd assets
          if [ "${{ matrix.pkg_ext }}" == "zip" ]; then
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              7z a ../flap-${{ matrix.target }}.zip ${{ matrix.artifact_name }}
            else
              zip -r ../flap-${{ matrix.target }}.zip ${{ matrix.artifact_name }}
            fi
          else
            tar -czf ../flap-${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}
          fi
          # Rename installer for upload
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv ${{ matrix.installer_name }} ../flap_installer_${{ matrix.target }}.exe
          else
            mv ${{ matrix.installer_name }} ../flap_installer_${{ matrix.target }}
          fi

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            flap-${{ matrix.target }}.${{ matrix.pkg_ext }}
            ${{ matrix.installer_name }}_${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
